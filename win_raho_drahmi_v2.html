<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>وين راحو دراهمي؟ — V2</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--ink:#171923;--muted:#747987;--line:#e7e8ee;--accent:#6c5ce7;--green:#20a779;--red:#e65c74}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:560px;margin:auto;padding:16px 15px 100px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.logo{font-size:21px;font-weight:950}.sub{font-size:12px;color:var(--muted)}
.hero{background:var(--ink);color:white;border-radius:25px;padding:20px;margin-bottom:16px}.hero small{opacity:.65}.balance{font-size:36px;font-weight:950;margin:3px 0 15px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#ffffff12;border:1px solid #ffffff18;border-radius:15px;padding:11px}.stat b{display:block;font-size:17px}.stat span{font-size:11px;opacity:.6}
.goal,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:13px}.goalhead{display:flex;justify-content:space-between;align-items:center}.goal h3,.card h3{margin:0;font-size:16px}.progress{height:10px;background:#ececf2;border-radius:20px;margin:12px 0 7px;overflow:hidden}.progress>div{height:100%;background:var(--accent);border-radius:20px}.tiny{font-size:12px;color:var(--muted)}
.alert{border-radius:18px;padding:15px;background:#fff2f5;border:1px solid #ffd9df;margin-bottom:13px}.alert b{display:block;margin-bottom:5px}.alert p{margin:0;font-size:13px;color:#555;line-height:1.7}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.ico{width:40px;height:40px;border-radius:13px;background:#f0eeff;display:grid;place-items:center;font-size:19px}.rmain{flex:1}.rmain b{display:block}.rmain small{color:var(--muted)}.amount{font-weight:850}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:15px;padding:14px;font-weight:850;font-size:14px}.primary{background:var(--accent);color:#fff}.secondary{background:#efeff5;color:var(--ink)}
.bottom{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(530px,calc(100% - 30px));display:grid;grid-template-columns:1fr 1fr;gap:9px}.bottom button{padding:15px;border:0;border-radius:17px;font-weight:900;box-shadow:0 10px 25px #0001}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(560px,100%);border-radius:25px 25px 0 0;padding:19px 17px 27px}.close{float:left;border:0;background:#eee;border-radius:50%;width:34px;height:34px;font-size:20px}.sheet h2{margin:3px 0 18px}label{font-size:12px;color:var(--muted)}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font-size:16px;margin:6px 0 13px}.wide{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:850}
.sharecard{background:linear-gradient(135deg,#171923,#312a61);color:#fff;border-radius:24px;padding:22px}.sharecard .big{font-size:30px;font-weight:950}.pill{display:inline-block;background:#ffffff18;border:1px solid #ffffff18;border-radius:30px;padding:7px 11px;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">💸 وين راحو دراهمي؟</div><div class="sub">V2 • سبتمبر 2026</div></header>
<section class="hero"><small>الباقي هذا الشهر</small><div class="balance" id="balance">0 دج</div><div class="stats"><div class="stat"><b id="income">0 دج</b><span>الدخل</span></div><div class="stat"><b id="spent">0 دج</b><span>المصاريف</span></div></div></section>

<section class="goal"><div class="goalhead"><h3>🎯 هدفك</h3><span class="tiny" id="goalText">مازال ما حددتش</span></div><div class="progress"><div id="goalBar" style="width:0%"></div></div><div class="tiny" id="goalDetail">حدد هدف ادخار باش نعاونك.</div></section>

<div class="actions"><button class="btn secondary" onclick="openIncome()">💰 حدد الدخل</button><button class="btn secondary" onclick="openGoal()">🎯 حدد الهدف</button></div>

<h3 style="font-size:16px;margin:20px 2px 10px">🚨 التقرير</h3><div class="alert" id="alert"></div>
<h3 style="font-size:16px;margin:20px 2px 10px">🧠 شخصيتك المالية</h3><div class="card"><div style="font-size:23px;font-weight:950" id="personality">مازال بكري 😄</div><div class="tiny" id="personalityDesc" style="margin-top:5px"></div></div>

<h3 style="font-size:16px;margin:20px 2px 10px">📊 وين راحو؟</h3><div class="card" id="cats"></div>
<h3 style="font-size:16px;margin:20px 2px 10px">🧾 آخر المصاريف</h3><div class="card" id="expenses"></div>
<div class="card"><button class="btn primary" style="width:100%" onclick="shareReport()">📲 حضّرلي بطاقة نشاركها</button></div>
</div>

<div class="bottom"><button class="primary" onclick="openExpense()">➕ زيد مصروف</button><button class="secondary" onclick="resetData()">♻️ بداية جديدة</button></div>

<div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2 id="modalTitle">إضافة</h2><div id="modalBody"></div></div></div>

<script>
const K='wd_v2'; let data=JSON.parse(localStorage.getItem(K)||'{"income":50000,"goal":0,"expenses":[]}');
const money=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n))+' دج';
const cats={'🍔 أكل':'🍔','☕ قهوة':'☕','🚕 نقل':'🚕','🛍️ شراء':'🛍️','🏠 دار':'🏠','📱 هاتف/إنترنت':'📱','🎮 ترفيه':'🎮','📚 دراسة':'📚','🧾 فواتير':'🧾','➕ أخرى':'➕'};
function save(){localStorage.setItem(K,JSON.stringify(data))}
function openExpense(){show('زيد مصروف',`<label>المبلغ</label><input id="xamount" type="number" min="1" placeholder="مثلاً 500"><label>التصنيف</label><select id="xcat">${Object.keys(cats).map(x=>`<option>${x}</option>`).join('')}</select><label>ملاحظة</label><input id="xnote" placeholder="مثلاً قهوة مع الصحاب"><button class="wide" onclick="addExpense()">سجّل المصروف</button>`)}
function openIncome(){show('الدخل الشهري',`<label>قداش تدخل في الشهر؟</label><input id="xincome" type="number" min="0" value="${data.income}"><button class="wide" onclick="setIncome()">حفظ</button>`)}
function openGoal(){show('هدف الادخار',`<label>حاب تجمع قداش؟</label><input id="xgoal" type="number" min="0" value="${data.goal||''}" placeholder="مثلاً 200000"><button class="wide" onclick="setGoal()">حفظ الهدف</button>`)}
function show(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function addExpense(){let a=+document.getElementById('xamount').value;if(!a)return alert('دخل مبلغ صحيح');data.expenses.push({amount:a,cat:document.getElementById('xcat').value,note:document.getElementById('xnote').value.trim(),date:new Date().toLocaleDateString('ar-DZ')});save();closeModal();render()}
function setIncome(){data.income=+document.getElementById('xincome').value||0;save();closeModal();render()}
function setGoal(){data.goal=+document.getElementById('xgoal').value||0;save();closeModal();render()}
function render(){
 let spent=data.expenses.reduce((s,e)=>s+e.amount,0), bal=data.income-spent;
 document.getElementById('income').textContent=money(data.income);document.getElementById('spent').textContent=money(spent);document.getElementById('balance').textContent=money(bal);
 let sums={};data.expenses.forEach(e=>sums[e.cat]=(sums[e.cat]||0)+e.amount);let sorted=Object.entries(sums).sort((a,b)=>b[1]-a[1]);
 document.getElementById('cats').innerHTML=sorted.length?sorted.map(([c,v])=>`<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:13px"><b>${c}</b><span>${money(v)}</span></div><div class="progress"><div style="width:${spent?v/spent*100:0}%"></div></div></div>`).join(''):'<div class="tiny">أضف مصاريف باش نحللوهم 👀</div>';
 let top=sorted[0], alert='';
 if(!spent)alert='<b>😇 مازال ما صرفتش والو!</b><p>زيد أول مصروف ونبدأ نفتشلك على التسريب.</p>';
 else if(bal<0)alert='<b>🚨 راك صرفت أكثر من دخلك!</b><p>المصاريف فاتو الدخل بـ '+money(-bal)+'. لازم نحبسوا النزيف.</p>';
 else alert=`<b>🚨 لقينا التسريب!</b><p>أكثر تصنيف تصرف عليه هو <strong>${top[0]}</strong> بـ <strong>${money(top[1])}</strong>. ${top[1]>=3000?'نقص شوية من هنا وتلقى الفرق آخر الشهر 😉':'الوضع تحت السيطرة 😎'}</p>`;
 document.getElementById('alert').innerHTML=alert;
 let p='مازال بكري 😄',d='سجّل شوية مصاريف ونكتشف شخصيتك.';
 if(spent){let coffee=sums['☕ قهوة']||0, food=sums['🍔 أكل']||0, shop=sums['🛍️ شراء']||0;if(coffee>=Math.max(food,shop)&&coffee>=3000){p='☕ ملك القهوة';d='القهوة راهي واخدة بلاصة معتبرة من ميزانيتك 😂';}else if(food>=Math.max(coffee,shop)){p='🍔 سلطان الماكلة';d='المعدة عندها ميزانية خاصة بيها.';}else if(shop>=Math.max(coffee,food)){p='🛍️ صياد التخفيضات';d='كل مرة تقول: غير هذي ونحبس 😅';}else{p='🧠 الصرف المتوازن';d='راك موزع مصاريفك بشكل معقول.'}}
 document.getElementById('personality').textContent=p;document.getElementById('personalityDesc').textContent=d;
 document.getElementById('expenses').innerHTML=data.expenses.length?data.expenses.slice().reverse().slice(0,10).map(e=>`<div class="row"><div class="ico">${cats[e.cat]||'➕'}</div><div class="rmain"><b>${e.cat.replace(/^\\S+\\s/,'')}</b><small>${e.note||e.date||'مصروف'}</small></div><div class="amount">${money(e.amount)}</div></div>`).join(''):'<div class="tiny">ماكان حتى مصروف.</div>';
 let goal=data.goal||0, saved=Math.max(0,bal), pct=goal?Math.min(100,saved/goal*100):0;document.getElementById('goalText').textContent=goal?money(goal):'مازال ما حددتش';document.getElementById('goalBar').style.width=pct+'%';document.getElementById('goalDetail').textContent=goal?`جمعت تقريباً ${money(saved)} من الهدف (${Math.round(pct)}%).`:'حدد هدف ادخار باش نعاونك.';
}
function shareReport(){let spent=data.expenses.reduce((s,e)=>s+e.amount,0),bal=data.income-spent;let sums={};data.expenses.forEach(e=>sums[e.cat]=(sums[e.cat]||0)+e.amount);let top=Object.entries(sums).sort((a,b)=>b[1]-a[1])[0];let p=document.getElementById('personality').textContent;show('بطاقة تقريرك',`<div class="sharecard"><div>💸 وين راحو دراهمي؟</div><div class="big">${money(bal)}</div><div style="opacity:.7">الباقي هذا الشهر</div><div class="pill">💸 صرفت ${money(spent)}</div><div class="pill">🧠 ${p}</div>${top?`<p style="margin-bottom:0">🚨 أكبر تسريب: ${top[0]} — ${money(top[1])}</p>`:''}</div><br><button class="wide" onclick="copyReport()">📋 نسخ التقرير</button>`)}
function copyReport(){let spent=data.expenses.reduce((s,e)=>s+e.amount,0),bal=data.income-spent;let t=`💸 وين راحو دراهمي؟\\nالباقي: ${money(bal)}\\nالمصاريف: ${money(spent)}\\nشخصيتي: ${document.getElementById('personality').textContent}\\nجرّبها أنت 👀`;navigator.clipboard?.writeText(t).then(()=>alert('تنسخ التقرير ✅'))}
function resetData(){if(confirm('متأكد تحب تمسح كل المصاريف؟')){data={income:50000,goal:0,expenses:[]};save();render()}}
render();
</script>
</body></html>
